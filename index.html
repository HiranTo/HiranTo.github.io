<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชวนแฟนดูหนัง 🎬</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

<div class="container">
    <h1>ไปไหนกันดี?</h1>
    <p>เลือกสิ่งที่เธอต้องการได้เลยจ้า</p>
    
        <a href="movies.html">
        <button>ดูหนัง 🎬</button>
        </a>
        <a href="Boat.html">
        <button>งานชักพระ 🙏</button>
        </a>
        <a href="eat.html">
        <button>ไปหาอะไรกินกัน 🍚</button>
        </a>
        <button id="noBtn" onmouseover="moveButton()">ไม่ว่างหรอก 😜</button>
    </form>
</div>

<script>
    document.getElementById('movieForm').addEventListener('submit', function(e) {
        e.preventDefault(); // ป้องกันไม่ให้หน้าเว็บรีเฟรช

        // 1. ดึงค่าจากฟอร์มที่แฟนกรอก
        const selectedMovie = document.getElementById('movie').value;
        const selectedTime = document.getElementById('datetime').value;

        // ฟอร์แมตวันที่ให้ระบุเวลาอ่านง่ายขึ้น
        const formattedTime = new Date(selectedTime).toLocaleString('th-TH', {
            dateStyle: 'medium',
            timeStyle: 'short'
        });

        // 2. ใส่ Webhook URL ของคุณที่ได้มาจาก Discord ตรงนี้
        const discordWebhookUrl = "https://discord.com/api/webhooks/1557812230010183744/dg5H9sxz9rySzch1whNpe6P0OUpU4MRDpseTawJ32vgs3i1441Kmss9GR5unf7O8eW2w"; 

        // 3. จัดรูปแบบข้อความที่จะส่งเข้า Discord (รองรับ Markdown ของ Discord)
        const payload = {
            content: "💖 **เย้! แฟนตอบรับคำชวนดูหนังแล้ว** 💖\n" +
             "🎬 **เรื่องที่อยากดู:** " + selectedMovie + "\n" +
             "📅 **วัน-เวลา:** " + formattedTime + "\n" +
             "🍿 *เตรียมป๊อปคอร์นรอได้เลยจ้า!*"
        };

        // 4. ยิงข้อมูลไปที่ Discord Webhook
        fetch(discordWebhookUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (response.ok) {
                alert('ส่งข้อมูลแล้วจ้า! นับเวลาถอยหลังรอได้เลย 💕');
            } else {
                alert('อุ๊ย ระบบมีปัญหาเล็กน้อย ลองใหม่อีกครั้งนะ');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
        });
    });
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            // สุ่มตำแหน่งใหม่ให้ปุ่มหนีเวลากล่องเมาส์ไปโดน
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }
</script>

</body>
</html>
