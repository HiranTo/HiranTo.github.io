<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชวนแฟนดูหนัง 🎬</title>
</head>
<style>
    body {
            font-family: 'Arial', sans-serif;
            background-color: #fff0f5;
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }

        .container2 {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }

        h1 { color: #ff69b4; }
        select, input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #ff69b4;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #ff1493; }
</style>
<body>

<div class="container">
    <h1>ไปหาอะไรกินกัน</h1>
    <p>เลือกสิ่งที่เธอต้องการได้เลยจ้า</p>
    
    <form id="movieForm">
        <!-- เลือกหนัง -->
       <label for="movie">🎬 ไปหาอะไรกินกัน:</label>
        <select id="movie" required>
            <option value="" disabled selected>-- ประเภท --</option>
            <option value="กินหมูกะทะ">กินหมูกะทะ</option>
            <option value="สุกี้ตี๋น้อย">สุกี้ตี๋น้อย</option>
            <option value="Saizen">Saizen</option>
            <option value="เดินตลาดกัน">เดินตลาดกัน</option>
        </select>

        <!-- เลือกวันเวลา -->
        <label for="datetime">📅 วันและเวลาที่สะดวก:</label>
        <input type="datetime-local" id="datetime" required>

        <!-- ปุ่มส่งข้อมูล -->
        <button type="submit">ไปด้วยกันนะ ❤️</button>
    </form>
</div>
       <div class="container2">
        <a href="index.html">
        <button>ย้อนกลับ</button>
        </a>
        </div>
<script>
    document.getElementById('movieForm').addEventListener('submit', function(e) {
        e.preventDefault(); // ป้องกันไม่ให้หน้าเว็บรีเฟรช

        // 1. ดึงค่าจากฟอร์มที่แฟนกรอก
        const selectedMovie = document.getElementById('movie').value;
        const selectedTime = document.getElementById('datetime').value;

        // ฟอร์แมตวันที่ให้ระบุเวลาอ่านง่ายขึ้น
        const formattedTime = new Date(selectedTime).toLocaleString('th-TH', {
            dateStyle: 'medium',
            timeStyle: 'short'
        });

        // 2. ใส่ Webhook URL ของคุณที่ได้มาจาก Discord ตรงนี้
        const discordWebhookUrl = "https://discord.com/api/webhooks/1557812230010183744/dg5H9sxz9rySzch1whNpe6P0OUpU4MRDpseTawJ32vgs3i1441Kmss9GR5unf7O8eW2w"; 

        // 3. จัดรูปแบบข้อความที่จะส่งเข้า Discord (รองรับ Markdown ของ Discord)
        const payload = {
            content: "💖 **เย้! ตอบรับคำชวนไปหาอะไรกินแล้ว** 💖\n" +
             "🎬 **สิ่งที่อยากทำ:** " + selectedMovie + "\n" +
             "📅 **วัน-เวลา:** " + formattedTime + "\n" +
             "🍿 *เตรียมเงินรอได้เลยจ้า!*"
        };

        // 4. ยิงข้อมูลไปที่ Discord Webhook
        fetch(discordWebhookUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (response.ok) {
                alert('ส่งข้อมูลแล้วจ้า! นับเวลาถอยหลังรอได้เลย 💕');
            } else {
                alert('อุ๊ย ระบบมีปัญหาเล็กน้อย ลองใหม่อีกครั้งนะ');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
        });
    });
</script>

</body>
</html>
